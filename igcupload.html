<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGC File Upload - WeSimGlide.org</title>
    <link rel="stylesheet" href="styles-dark.css">
</head>
<body>
    <!-- Upload container positioned in the top-left -->
    <div class="upload-container" id="dropZone">
        <button class="button-style" id="selectFileButton">Select IGC File</button>
        <p>or drag and drop your IGC file here</p>
        <input type="file" id="igcFileInput" accept=".igc">
    </div>
    <!-- Output container to display file info -->
    <div id="output"></div>

    <script src="igcupload.js"></script>
</body>
</html>
